0:
    # The v4l2 format can be found using the command: v4l2-ctl --list-formats-ext -d /dev/videoX, where X is the camera device number.
    v4l2_format: YUYV
    gst_format: YUY2
    # The name is used to regex search the available camera devices.
    name: RealSense
    width: 1280
    height: 800
    framerate: 30/1
    baseline: 59 # The distance between the two cameras in millimeters.
    hfov: 90 # The horizontal field of view of the camera in degrees.
    focal_px: 648 # The focal length of the camera in pixels at 1280x800.
