name: CodeQL Workflow

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "32 3 * * 1" # Weekly Monday 03:32 UTC
    workflow_dispatch:

permissions:
    actions: read
    contents: read
    security-events: write

jobs:
    analyze-python:
        name: Analyze (Python)
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: python
                  queries: security-extended
                  config-file: ./.github/codeql/codeql-config.yml

            # Python analysis is extraction-based; no build needed for interpreted code.
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "/language:python"

    analyze-javascript:
        name: Analyze (JavaScript/TypeScript)
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: javascript-typescript
                  queries: security-extended
                  config-file: ./.github/codeql/codeql-config.yml

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "/language:javascript-typescript"

    # --------------------------------------------------------------------------
    # C++ analysis
    #
    # Requires a real compilation so CodeQL can trace the build. We reuse the
    # project's proven build container (vtautoboat/development_image_firmware)
    # and run colcon exactly like the release pipeline does. GitHub Actions
    # runs all steps within a single job inside the specified container, so
    # codeql-action/init's tracer watches the same compile processes that
    # colcon produces.
    #
    # The firmware directory is excluded via codeql-config.yml because it
    # targets bare-metal ARM (arm-none-eabi toolchain) and cannot be built in
    # a standard Linux container.
    # --------------------------------------------------------------------------
    analyze-cpp:
        name: Analyze (C++)
        runs-on: ubuntu-22.04
        # Run the entire job inside the ROS 2 build container so CodeQL's
        # compiler tracer sees every gcc/g++ invocation from colcon.
        container:
            image: vtautoboat/development_image_firmware:amd64
            options: --user root
        strategy:
            fail-fast: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: cpp
                  queries: security-extended
                  config-file: ./.github/codeql/codeql-config.yml

            - name: Build C++ sources for CodeQL tracing
              # NOTE: must use bash explicitly — the container image sets a `sh`
              # entrypoint whose shell lacks `source`.
              shell: bash
              env:
                  # Ignore only packages that don't contain C++ or need special
                  # hardware. This is intentionally broader than the release
                  # builds so colcon can focus on C++ extraction.
                  IGNORE_PACKAGES: "old_sailboat_simulation object_detection"
              run: |
                  source /opt/ros/humble/setup.bash
                  colcon build \
                    --packages-ignore ${IGNORE_PACKAGES} \
                    --cmake-args \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                    --event-handlers console_direct+

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "/language:cpp"
